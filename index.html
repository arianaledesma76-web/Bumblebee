<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenidos 💛</title>

    <!-- Librería oficial de model-viewer -->
    <script
        type="module"
        src="[ajax.googleapis.com](https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js)">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: sans-serif;
            background-color: #645e3b;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("descarga (3).jpeg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.5;
            z-index: 0;
        }

        .welcome-container {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            text-align: center;
            pointer-events: none;
            z-index: 3;
        }

        .welcome-container h1 {
            margin: 0;
            color: #fbe04a;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .welcome-container p {
            margin: 5px 0 0;
            color: #fbe04a;
            font-size: 1.1rem;
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        model-viewer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
            z-index: 1;
        }

        #ar-button {
            position: absolute;
            right: 32px;
            bottom: 32px;
            z-index: 4;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background-color: #ffffff;
            color: #645e3b;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            user-select: none;
        }

        #ar-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #ar-message {
            position: absolute;
            right: 32px;
            bottom: 90px;
            z-index: 4;
            max-width: 280px;
            margin: 0;
            color: white;
            text-align: right;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .wheel-particle {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            font-size: 24px;
            animation: flyParticle 1s ease-out forwards;
        }

        @keyframes flyParticle {
            from {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }

            to {
                opacity: 0;
                transform:
                    translate(var(--x), var(--y))
                    scale(0.5)
                    rotate(var(--r));
            }
        }

        @media (max-width: 600px) {
            .welcome-container h1 {
                font-size: 2rem;
            }

            #ar-button {
                right: 20px;
                bottom: 24px;
                left: 20px;
                width: calc(100% - 40px);
            }

            #ar-message {
                right: 20px;
                bottom: 85px;
                left: 20px;
                max-width: none;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="welcome-container">
        <h1>Bienvenidos 💛</h1>
        <p>Interactúa con el modelo o proyéctalo en tu espacio móvil</p>
    </div>

    <model-viewer
        id="bumblebee-viewer"
        src="modelado.glb"
        ios-src="modeladoau.usdz"
        alt="Modelo 3D interactivo de Bumblebee"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        touch-action="pan-y">

        <button
            type="button"
            slot="ar-button"
            id="ar-button">
            Apretá para ver a Bumblebee (AR)
        </button>
    </model-viewer>

    <p id="ar-message" hidden></p>

    <script>
        const viewer = document.getElementById("bumblebee-viewer");
        const arButton = document.getElementById("ar-button");
        const arMessage = document.getElementById("ar-message");

        function showMessage(message) {
            arMessage.textContent = message;
            arMessage.hidden = false;
        }

        function createWheelParticles(event) {
            const rect = arButton.getBoundingClientRect();
            const originX = event.clientX || rect.left + rect.width / 2;
            const originY = event.clientY || rect.top + rect.height / 2;

            for (let i = 0; i < 10; i++) {
                const particle = document.createElement("div");
                particle.className = "wheel-particle";
                particle.textContent = "🛞";
                particle.style.left = `${originX}px`;
                particle.style.top = `${originY}px`;

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 120 + 40;

                particle.style.setProperty(
                    "--x",
                    `${Math.cos(angle) * velocity}px`
                );

                particle.style.setProperty(
                    "--y",
                    `${Math.sin(angle) * velocity}px`
                );

                particle.style.setProperty(
                    "--r",
                    `${Math.random() * 360}deg`
                );

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        arButton.addEventListener("click", async (event) => {
            createWheelParticles(event);
            arMessage.hidden = true;

            try {
                /*
                 * El botón con slot="ar-button" normalmente activa AR
                 * automáticamente. Este llamado explícito sirve también
                 * cuando el comportamiento automático no se dispara.
                 */
                await viewer.activateAR();
            } catch (error) {
                console.error("No se pudo iniciar la realidad aumentada:", error);

                showMessage(
                    "No se pudo abrir la realidad aumentada. Usá un celular compatible y abrí la página mediante HTTPS."
                );
            }
        });

        viewer.addEventListener("load", () => {
            console.log("Modelo 3D cargado correctamente.");
        });

        viewer.addEventListener("error", (event) => {
            console.error("Error al cargar el modelo 3D:", event);
            showMessage(
                "No se pudo cargar el modelo 3D. Revisá los archivos modelado.glb y modeladoau.usdz."
            );
        });

        viewer.addEventListener("ar-status", (event) => {
            console.log("Estado de AR:", event.detail.status);

            if (event.detail.status === "failed") {
                showMessage(
                    "La realidad aumentada no está disponible en este dispositivo o navegador."
                );
            }
        });
    </script>
</body>
</html>
