<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#645e3b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bienvenidos 💛</title>
    <!-- Model Viewer oficial -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            font-family: Arial, sans-serif;
            background-color: #645e3b;
        }
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("descarga%20(3).jpeg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        .welcome-container {
            position: absolute;
            top: calc(40px + env(safe-area-inset-top));
            left: 0;
            width: 100%;
            padding: 0 20px;
            text-align: center;
            pointer-events: none;
            z-index: 3;
        }
        .welcome-container h1 {
            margin: 0;
            color: #fbe04a;
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            font-weight: bold;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .welcome-container p {
            margin: 8px 0 0;
            color: #fbe04a;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        model-viewer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
            z-index: 1;
            touch-action: pan-y;
        }
        #ar-button {
            position: absolute;
            right: 32px;
            bottom: calc(32px + env(safe-area-inset-bottom));
            z-index: 4;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #645e3b;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #ar-button:active {
            transform: scale(0.97);
        }
        #ar-message {
            position: absolute;
            right: 20px;
            bottom: calc(90px + env(safe-area-inset-bottom));
            left: 20px;
            z-index: 4;
            margin: 0;
            color: white;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .wheel-particle {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            font-size: 24px;
            animation: flyParticle 1s ease-out forwards;
        }
        @keyframes flyParticle {
            from {
                opacity: 1;
                transform: translate(0,0) scale(1) rotate(0deg);
            }
            to {
                opacity: 0;
                transform: translate(var(--x),var(--y)) scale(0.5) rotate(var(--r));
            }
        }
        @media (max-width: 600px) {
            .welcome-container {
                top: calc(30px + env(safe-area-inset-top));
            }
            #ar-button {
                right: 20px;
                bottom: calc(24px + env(safe-area-inset-bottom));
                left: 20px;
                width: calc(100% - 40px);
                padding: 15px 12px;
                font-size: 15px;
            }
            #ar-message {
                bottom: calc(85px + env(safe-area-inset-bottom));
            }
        }
        @media (max-height: 500px) {
            .welcome-container {
                top: 10px;
            }
            .welcome-container h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Bienvenidos 💛</h1>
        <p>Interactúa con el modelo o proyéctalo en tu espacio móvil</p>
    </div>

    <!-- MODEL-VIEWER ACTUALIZADO Y OPTIMIZADO -->
    <model-viewer 
        id="bumblebee-viewer"
        alt="Modelo 3D interactivo de Bumblebee"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto"
        ar-placement="floor"
        camera-controls 
        auto-rotate
        shadow-intensity="1" 
        touch-action="pan-y"
        interaction-prompt="auto">
        
        <button
            type="button"
            slot="ar-button"
            id="ar-button">
            Apretá para ver a Bumblebee (AR)
        </button>
    </model-viewer>

    <p id="ar-message" hidden></p>

    <script>
        const viewer = document.getElementById("bumblebee-viewer");
        const arButton = document.getElementById("ar-button");
        const arMessage = document.getElementById("ar-message");

        // DIRECCIONES ABSOLUTAS HTTPS DE LOS MODELOS
        const modelGLB = new URL("./modelado.glb", document.baseURI).href;
        const modelUSDZ = new URL("./modeladoau.usdz", document.baseURI).href;

        // GLB para Android y navegador
        viewer.setAttribute("src", modelGLB);
        // USDZ para iPhone
        viewer.setAttribute("ios-src", modelUSDZ);

        function showMessage(message) {
            arMessage.textContent = message;
            arMessage.hidden = false;
        }

        // EFECTO DE RUEDAS
        function createWheelParticles(event) {
            const rect = arButton.getBoundingClientRect();
            const originX = event.clientX || rect.left + rect.width / 2;
            const originY = event.clientY || rect.top + rect.height / 2;

            for (let i = 0; i < 10; i++) {
                const particle = document.createElement("div");
                particle.className = "wheel-particle";
                particle.textContent = "🛞";
                particle.style.left = `${originX}px`;
                particle.style.top = `${originY}px`;

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 120 + 40;

                particle.style.setProperty("--x", `${Math.cos(angle) * velocity}px`);
                particle.style.setProperty("--y", `${Math.sin(angle) * velocity}px`);
                particle.style.setProperty("--r", `${Math.random() * 360}deg`);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        // DISPARADOR DE EFECTO CON { passive: true } PARA NO BLOQUEAR LA ACCIÓN NATIVA
        arButton.addEventListener("click", (event) => {
            createWheelParticles(event);
            arMessage.hidden = true;
        }, { passive: true });

        // COMPROBAR CARGA DEL MODELO
        viewer.addEventListener("load", () => {
            console.log("Bumblebee cargado correctamente.");
            console.log("Modelo GLB:", modelGLB);
            console.log("¿Se puede iniciar AR?", viewer.canActivateAR);
        });

        // ERRORES DE CARGA
        viewer.addEventListener("error", () => {
            showMessage("No se pudo cargar Bumblebee. Verificá que modelado.glb esté disponible en HTTPS.");
            console.error("Error cargando el modelo GLB.");
        });

        // ESTADOS DE REALIDAD AUMENTADA
        viewer.addEventListener("ar-status", (event) => {
            const status = event.detail.status;
            console.log("Estado AR:", status);
            if (status === "failed") {
                showMessage("No se pudo iniciar AR. Abrí la página en Chrome y verificá que tu dispositivo sea compatible con ARCore.");
            }
            if (status === "session-started") {
                arMessage.hidden = true;
            }
            if (status === "not-presenting") {
                arMessage.hidden = true;
            }
        });

        // COMPROBAR SI SE ABRE EN UN NAVEGADOR COMPATIBLE
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isAndroid) {
            console.log("Dispositivo Android detectado.");
            console.log("Modo AR prioritario: Scene Viewer.");
        }
        if (isIOS) {
            console.log("Dispositivo Apple detectado.");
            console.log("Modo AR: Quick Look.");
        }
    </script>
</body>
</html>
